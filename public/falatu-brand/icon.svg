<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fala Tu">
  <!-- Ícone oficial Fala Tu — "Ciclo Inteligente": anel Cobalto/Coral/Menta
       (falar → entender → agir → conferir) com o check Nuvem no centro sobre
       o tile Ink. Geometria idêntica ao <FalatuLogo> (mesmo raio/arcos). -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="#0E1A2E"/>
  <g fill="none" stroke-width="44" stroke-linecap="round">
    <!-- Menta (base — conclusão/confiança) -->
    <path d="M370.9 352.4 A 150 150 0 0 1 141.1 352.4" stroke="#12B981"/>
    <!-- Cobalto (esquerda — marca-mãe) -->
    <path d="M115.1 307.3 A 150 150 0 0 1 229.9 108.3" stroke="#3B4DE0"/>
    <!-- Coral (direita — ação/energia) -->
    <path d="M282.1 108.3 A 150 150 0 0 1 396.9 307.3" stroke="#FF6A4D"/>
  </g>
  <!-- Check Nuvem -->
  <path d="M179 266 L236 323 L348 195" fill="none" stroke="#F4F6FC" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
